<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Amostras Doremus - Executivo</title>
  
  <!-- Tailwind CSS para Estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonte Inter para visual corporativo premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Bibliotecas do React e Babel (Tradutor) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts (Gráficos) - Versão estável unpkg -->
  <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  
  <div id="root"></div>

  <!-- Script da Aplicação -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip: RechartsTooltip, Legend, BarChart, Bar, XAxis, YAxis, CartesianGrid } = window.Recharts;

    const IconSearch = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>;
    const IconFilter = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
    const IconPackage = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
    const IconClock = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconAlertCircle = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconCheckCircle = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconBarChart3 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/></svg>;
    const IconListFilter = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>;
    const IconRefreshCw = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>;
    const IconExternalLink = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;
    const IconMessageSquare = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const IconClose = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;

    // Link da API Google Sheets Apps Script
    const URL_DA_SUA_API = 'https://script.google.com/macros/s/AKfycbxkyuluhdtx97TD0f-qwiDxjc370xXHM8kyr8RLByHdfrPmfXKBsuWVnlwg7LkA22uN/exec';

    // Segmentos organizados exatamente de acordo com as abas da planilha
    const DISPLAY_SEGMENTOS = [
      'Nutrição Animal',
      'Aromas Doce',
      'Nutrimix',
      'Aroma Salgado',
      'Panificação',
      'Recheios',
      'Cárneos & Commodities',
      'Lácteos',
      'Molhos',
      'Sorvetes'
    ];

    // Mapeamento robusto para cruzar os dados brutos de abas com acentos ou formatos diferentes
    const MAPA_NORMALIZACAO = {
      'NUTRICAOANIMAL': 'Nutrição Animal',
      'NUTRIÇÃOANIMAL': 'Nutrição Animal',
      'AROMASDOCE': 'Aromas Doce',
      'NUTRIMIX': 'Nutrimix',
      'AROMASALGADO': 'Aroma Salgado',
      'AROMASSALGADOS': 'Aroma Salgado',
      'PANIFICACAO': 'Panificação',
      'PANIFICAÇÃO': 'Panificação',
      'RECHEIOS': 'Recheios',
      'CARNEOSCOMMODITIES': 'Cárneos & Commodities',
      'CARNEOS': 'Cárneos & Commodities',
      'COMMODITIES': 'Cárneos & Commodities',
      'LACTEOS': 'Lácteos',
      'LÁCTEOS': 'Lácteos',
      'MOLHOS': 'Molhos',
      'SORVETES': 'Sorvetes'
    };

    const STATUS_COLORS = {
      'Em Fila': '#94A3B8',          // Slate (Cinza Médio)
      'OPs Abertas': '#4F46E5',      // Indigo Moderno
      'Em Andamento': '#F59E0B',     // Amber
      'Finalizando': '#10B981',      // Emerald
      'Entregue': '#1E293B'          // Slate Escuro
    };

    function KpiCard({ title, value, icon, border, subtitle }) {
      return (
        <div className="bg-white border border-slate-100 p-5 rounded-xl shadow-sm flex items-center justify-between transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md">
          <div className="space-y-1">
            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">{title}</p>
            <p className="text-3xl font-extrabold text-slate-800 tracking-tight">{value}</p>
            {subtitle && <p className="text-[10px] text-slate-400 font-medium">{subtitle}</p>}
          </div>
          <div className={`p-3.5 rounded-xl ${border}`}>
            {icon}
          </div>
        </div>
      );
    }

    function StatusBadge({ status }) {
      const styles = {
        'Em Fila': 'bg-slate-100 text-slate-600 border-slate-200',
        'OPs Abertas': 'bg-indigo-50 text-indigo-700 border-indigo-200',
        'Em Andamento': 'bg-amber-50 text-amber-700 border-amber-200',
        'Finalizando': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Entregue': 'bg-slate-800 text-slate-100 border-slate-700'
      };
      return <span className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border whitespace-nowrap ${styles[status] || 'bg-slate-50 text-slate-700'}`}>{status}</span>;
    }

    function App() {
      const [pedidos, setPedidos] = useState([]);
      const [carregando, setCarregando] = useState(true);
      const [erro, setErro] = useState(null);
      const [busca, setBusca] = useState('');
      const [segmentoFiltro, setSegmentoFiltro] = useState('Todos');
      const [statusFiltro, setStatusFiltro] = useState('Todos');
      const [pedidoSelecionado, setPedidoSelecionado] = useState(null);

      const carregarDados = () => {
        setCarregando(true);
        setErro(null);

        fetch(URL_DA_SUA_API)
          .then(response => {
            if (!response.ok) throw new Error('Falha ao obter conexão com o Sheets');
            return response.json();
          })
          .then(data => {
            const pedidosAgrupados = new Map();
            
            data.forEach(row => {
              const id = String(row.id || '').trim();
              if (!id) return; // Ignora se faltar o ID

              // Normalização de Segmento
              const segmentoOriginal = String(row.segmento || '').trim();
              const segmentoChave = segmentoOriginal
                .toUpperCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") 
                .replace(/[\s_/&-]/g, "");       

              const segmentoMapeado = MAPA_NORMALIZACAO[segmentoChave] || segmentoOriginal;

              const rawStatus = String(row.status || '').trim();
              let statusItem = 'Em Fila';
              if (rawStatus === 'OP Aberta' || rawStatus === 'OPs Abertas') statusItem = 'OPs Abertas';
              else if (rawStatus === 'Em Andamento') statusItem = 'Em Andamento';
              else if (rawStatus === 'Finalizando') statusItem = 'Finalizando';
              else if (rawStatus === 'Entregue') statusItem = 'Entregue';
              else statusItem = 'Em Fila'; // Mapeia vazios e itens novos para "Em Fila"

              const obsValor = String(row.observacao || '').trim();
              const produtoNome = String(row.produto || 'Amostra').trim();
              const descricaoItem = String(row.descricao || '').trim();
              const qtdeItem = String(row.quantidade || '1').trim();
              const vendedorNome = String(row.vendedor || 'Não Informado').trim();

              const itemObj = {
                idLinha: row.idLinha || Math.random(),
                produto: produtoNome,
                descricao: descricaoItem,
                quantidade: qtdeItem,
                vendedor: vendedorNome,
                status: statusItem,
                observacao: obsValor,
                dataEntrada: row.dataEntrada || '-',
                dataEntrega: row.dataEntrega || '-'
              };

              if (!pedidosAgrupados.has(id)) {
                pedidosAgrupados.set(id, {
                  id: id,
                  cliente: String(row.cliente || 'Sem Cliente').trim(),
                  segmento: segmentoMapeado,
                  dataEntrada: row.dataEntrada || '-',
                  statusGeral: statusItem,
                  itens: [itemObj],
                  observacaoGeral: obsValor ? [obsValor] : []
                });
              } else {
                const pedidoExistente = pedidosAgrupados.get(id);
                pedidoExistente.itens.push(itemObj);
                if (obsValor) {
                  pedidoExistente.observacaoGeral.push(obsValor);
                }
                
                // Critério de criticidade de status do pedido unificado:
                const statusList = pedidoExistente.itens.map(i => i.status);
                if (statusList.includes('OPs Abertas')) {
                  pedidoExistente.statusGeral = 'OPs Abertas';
                } else if (statusList.includes('Em Andamento')) {
                  pedidoExistente.statusGeral = 'Em Andamento';
                } else if (statusList.includes('Finalizando')) {
                  pedidoExistente.statusGeral = 'Finalizando';
                } else if (statusList.includes('Em Fila')) {
                  pedidoExistente.statusGeral = 'Em Fila';
                } else {
                  pedidoExistente.statusGeral = 'Entregue';
                }
              }
            });

            const listaTratada = Array.from(pedidosAgrupados.values()).map(p => ({
              ...p,
              observacao: Array.from(new Set(p.observacaoGeral)).join(' | ')
            }));

            setPedidos(listaTratada);
            setCarregando(false);
          })
          .catch(err => {
            console.error(err);
            setErro("Falha ao sincronizar com o banco de dados da planilha. Verifique se o script do Google foi publicado corretamente.");
            setCarregando(false);
          });
      };

      useEffect(() => {
        carregarDados();
        const intervalo = setInterval(carregarDados, 300000); 
        return () => clearInterval(intervalo);
      }, []);

      const dadosFiltrados = useMemo(() => {
        return pedidos.filter(pedido => {
          const matchBusca = (pedido.cliente || '').toLowerCase().includes(busca.toLowerCase()) || 
                             (pedido.id || '').toLowerCase().includes(busca.toLowerCase());
          const matchSegmento = segmentoFiltro === 'Todos' || pedido.segmento === segmentoFiltro;
          const matchStatus = statusFiltro === 'Todos' || pedido.statusGeral === statusFiltro;
          return matchBusca && matchSegmento && matchStatus;
        });
      }, [pedidos, busca, segmentoFiltro, statusFiltro]);

      // Métricas Consolidadas (Um ID de pedido conta exatamente como 1 unidade)
      const kpis = useMemo(() => {
        const kpi = { total: dadosFiltrados.length, emFila: 0, opsAbertas: 0, finalizando: 0, emAndamento: 0, entregue: 0 };
        dadosFiltrados.forEach(p => {
          if (p.statusGeral === 'Em Fila') kpi.emFila++;
          if (p.statusGeral === 'OPs Abertas') kpi.opsAbertas++;
          if (p.statusGeral === 'Finalizando') kpi.finalizando++;
          if (p.statusGeral === 'Em Andamento') kpi.emAndamento++;
          if (p.statusGeral === 'Entregue') kpi.entregue++;
        });
        return kpi;
      }, [dadosFiltrados]);

      const temFiltroAtivo = segmentoFiltro !== 'Todos' || statusFiltro !== 'Todos' || busca !== '';

      const limparTodosFiltros = () => {
        setBusca('');
        setSegmentoFiltro('Todos');
        setStatusFiltro('Todos');
      };

      const dadosGraficoPie = useMemo(() => {
        return [
          { name: 'Em Fila', value: kpis.emFila },
          { name: 'OPs Abertas', value: kpis.opsAbertas },
          { name: 'Em Andamento', value: kpis.emAndamento },
          { name: 'Finalizando', value: kpis.finalizando },
          { name: 'Entregue', value: kpis.entregue },
        ].filter(d => d.value > 0);
      }, [kpis]);

      const dadosHeatmap = useMemo(() => {
        const contagem = {};
        DISPLAY_SEGMENTOS.forEach(seg => contagem[seg] = 0);
        dadosFiltrados.forEach(p => {
          if (DISPLAY_SEGMENTOS.includes(p.segmento)) {
            contagem[p.segmento] = (contagem[p.segmento] || 0) + 1;
          }
        });
        const maxCount = Math.max(...Object.values(contagem), 1); 
        return Object.entries(contagem).map(([segmento, count]) => {
          const intensidade = count / maxCount;
          let bgClass = 'bg-slate-50 text-slate-400 border-slate-200';
          if (count > 0) {
            if (intensidade <= 0.25) bgClass = 'bg-indigo-50 text-indigo-900 border-indigo-200';
            else if (intensidade <= 0.5) bgClass = 'bg-indigo-100 text-indigo-950 border-indigo-300';
            else if (intensidade <= 0.75) bgClass = 'bg-indigo-500 text-white border-indigo-600';
            else bgClass = 'bg-indigo-950 text-white border-indigo-950';
          }
          return { segmento, count, bgClass };
        }).sort((a, b) => b.count - a.count);
      }, [dadosFiltrados]);

      return (
        <div className="min-h-screen pb-12 flex flex-col relative overflow-x-hidden">
          
          {/* HEADER EXECUTIVO PREMIUM */}
          <header className="bg-white border-b border-slate-100 sticky top-0 z-40 px-6 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="p-1 bg-white rounded-lg flex items-center justify-center">
                <img src="https://i.postimg.cc/yg0Qnz4C/as-02.png" alt="Doremus Logo" className="h-10 w-auto object-contain" />
              </div>
              <div className="h-8 w-[1px] bg-slate-200 hidden sm:block"></div>
              <div>
                <h1 className="text-base font-extrabold text-slate-800 tracking-tight flex items-center gap-2">
                  Painel de Amostras
                  <span className="text-[9px] bg-indigo-50 text-indigo-600 border border-indigo-100 px-1.5 py-0.5 rounded font-bold">Real-time</span>
                </h1>
                <p className="text-[11px] text-slate-400 font-medium">Controle Unificado por Segmento</p>
              </div>
            </div>

            {/* Ações Rápidas de cabeçalho */}
            <div className="flex items-center gap-2.5 w-full sm:w-auto justify-end">
              <a 
                href="https://docs.google.com/spreadsheets/d/1-wslrsgH0gZwTinfc49KdqtM20K88UayNDdZJ7wh_As/edit?usp=sharing" 
                target="_blank" 
                rel="noopener noreferrer" 
                className="px-3.5 py-2 bg-indigo-650 hover:bg-indigo-700 bg-slate-800 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-2 transition-all"
              >
                <IconExternalLink className="w-3.5 h-3.5" />
                Planilha de Amostras
              </a>
              <button 
                onClick={carregarDados} 
                disabled={carregando} 
                className="p-2 bg-slate-50 border border-slate-200 text-slate-600 rounded-lg hover:bg-slate-100 transition-colors disabled:opacity-50 flex items-center" 
                title="Sincronizar Dados"
              >
                <IconRefreshCw className={`w-4 h-4 ${carregando ? 'animate-spin' : ''}`} />
              </button>
            </div>
          </header>

          {carregando && pedidos.length === 0 && (
            <div className="flex-1 flex flex-col items-center justify-center p-12">
               <div className="p-5 bg-white rounded-2xl shadow-sm border border-slate-150 flex flex-col items-center max-w-sm">
                 <IconRefreshCw className="w-10 h-10 text-indigo-600 animate-spin mb-4" />
                 <p className="text-xs font-bold text-slate-700 tracking-tight text-center">Carregando e processando amostras...</p>
                 <p className="text-[10px] text-slate-450 mt-1 text-center">Organizando os fluxos de trabalho do Sheets.</p>
               </div>
            </div>
          )}
          
          {erro && (
            <div className="max-w-7xl mx-auto mt-6 w-full px-6">
              <div className="bg-red-50 border border-red-200 p-4 rounded-xl text-red-700 shadow-sm font-medium flex items-center gap-3 text-xs">
                <IconAlertCircle className="w-5 h-5 text-red-500 shrink-0" />
                <span>⚠️ {erro}</span>
              </div>
            </div>
          )}

          {/* DASHBOARD PRINCIPAL */}
          {!erro && pedidos.length > 0 && (
            <main className="max-w-7xl mx-auto w-full px-6 mt-6 space-y-6">
              
              {/* CARTÕES DE KPI (Atualizado para 6 colunas na tela grande) */}
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                <KpiCard title="Total de Pedidos" value={kpis.total} icon={<IconListFilter className="w-5 h-5 text-slate-600" />} border="bg-slate-50 border-slate-100 text-slate-600" subtitle="Listados" />
                <KpiCard title="Em Fila" value={kpis.emFila} icon={<IconClock className="w-5 h-5 text-slate-500" />} border="bg-slate-100 border-slate-200 text-slate-600" subtitle="Aguardando ação" />
                <KpiCard title="OPs Abertas" value={kpis.opsAbertas} icon={<IconAlertCircle className="w-5 h-5 text-indigo-600" />} border="bg-indigo-50 border-indigo-100 text-indigo-600" subtitle="Produção iniciada" />
                <KpiCard title="Em Andamento" value={kpis.emAndamento} icon={<IconRefreshCw className="w-5 h-5 text-amber-600" />} border="bg-amber-50 border-amber-100 text-amber-600" subtitle="Processando lote" />
                <KpiCard title="Finalizando" value={kpis.finalizando} icon={<IconCheckCircle className="w-5 h-5 text-emerald-600" />} border="bg-emerald-50 border-emerald-100 text-emerald-600" subtitle="Fase conclusiva" />
                <KpiCard title="Entregue" value={kpis.entregue} icon={<IconPackage className="w-5 h-5 text-slate-700" />} border="bg-slate-200 border-slate-300 text-slate-800" subtitle="Lote concluído" />
              </div>

              {/* GRÁFICOS ANALÍTICOS */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* MATRIZ DE CALOR (HEATMAP) */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 lg:col-span-2 flex flex-col">
                  <div className="border-b border-slate-100 pb-3 mb-4">
                    <h2 className="text-xs font-bold text-slate-800 flex items-center gap-2">
                      <IconBarChart3 className="w-4 h-4 text-indigo-600" />
                      Pedidos por Segmento
                    </h2>
                    <p className="text-[10px] text-slate-400 mt-0.5">Distribuição consolidada do volume total de amostras.</p>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5 flex-1">
                    {dadosHeatmap.map((item) => (
                      <div key={item.segmento} className={`${item.bgClass} p-3 rounded-xl border flex flex-col justify-between h-20 shadow-sm transition-all hover:scale-[1.02] cursor-default`}>
                        <span className="text-[9px] font-bold uppercase tracking-wider opacity-90 leading-tight">{item.segmento}</span>
                        <div className="flex items-baseline justify-between">
                          <span className="text-2xl font-black">{item.count}</span>
                          <span className="text-[9px] opacity-75 font-semibold">Pedidos</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* GRÁFICO PIE DE DISTRIBUIÇÃO */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col">
                  <div className="border-b border-slate-100 pb-3 mb-4">
                    <h2 className="text-xs font-bold text-slate-800">Status Geral das Amostras</h2>
                    <p className="text-[10px] text-slate-400 mt-0.5">Visão percentual das fases operacionais.</p>
                  </div>
                  <div className="h-44 flex-1 relative">
                    {dadosGraficoPie.length > 0 ? (
                      <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                          <Pie data={dadosGraficoPie} cx="50%" cy="50%" innerRadius={42} outerRadius={62} paddingAngle={4} dataKey="value">
                            {dadosGraficoPie.map((entry, index) => <Cell key={`cell-${index}`} fill={STATUS_COLORS[entry.name]} />)}
                          </Pie>
                          <RechartsTooltip formatter={(value) => [`${value} pedidos`, 'Volume']} contentStyle={{ fontSize: 10, borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px -1px rgb(0 0 0 / 0.1)' }} />
                          <Legend verticalAlign="bottom" height={24} iconType="rect" wrapperStyle={{ fontSize: 9, fontWeight: 'bold' }} />
                        </PieChart>
                      </ResponsiveContainer>
                    ) : (<div className="w-full h-full flex items-center justify-center text-[10px] text-slate-400">Nenhum dado selecionado</div>)}
                  </div>
                </div>
              </div>

              {/* TABELA PRINCIPAL INTEGRADA COM FILTROS */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                
                <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xs font-bold text-slate-800 flex items-center gap-2">
                      Monitor Geral de Lotes
                      <span className="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold">
                        {dadosFiltrados.length} listados
                      </span>
                    </h2>
                    <p className="text-[11px] text-slate-400 mt-0.5">Clique em um pedido da lista para ver os detalhes e status específicos de suas amostras.</p>
                  </div>

                  {/* Filtros Integrados no Cabeçalho */}
                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    
                    {/* Campo de Busca */}
                    <div className="relative flex-1 sm:w-60">
                      <IconSearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input 
                        type="text" 
                        placeholder="ID Pedido ou Cliente..." 
                        value={busca} 
                        onChange={(e) => setBusca(e.target.value)} 
                        className="w-full pl-9 pr-4 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-medium placeholder:text-slate-400 text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 transition-all shadow-sm" 
                      />
                    </div>

                    {/* Filtro de Segmento */}
                    <div className="relative">
                      <select 
                        value={segmentoFiltro} 
                        onChange={(e) => setSegmentoFiltro(e.target.value)} 
                        className="w-full sm:w-44 pl-3 pr-8 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500 appearance-none shadow-sm"
                      >
                        <option value="Todos">Segmento: Todos</option>
                        {DISPLAY_SEGMENTOS.map(seg => <option key={seg} value={seg}>{seg}</option>)}
                      </select>
                      <IconFilter className="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                    </div>

                    {/* Filtro de Status */}
                    <div className="relative">
                      <select 
                        value={statusFiltro} 
                        onChange={(e) => setStatusFiltro(e.target.value)} 
                        className="w-full sm:w-40 pl-3 pr-8 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500 appearance-none shadow-sm"
                      >
                        <option value="Todos">Status: Todos</option>
                        <option value="Em Fila">Em Fila</option>
                        <option value="OPs Abertas">OPs Abertas</option>
                        <option value="Em Andamento">Em Andamento</option>
                        <option value="Finalizando">Finalizando</option>
                        <option value="Entregue">Entregue</option>
                      </select>
                      <IconFilter className="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" />
                    </div>

                    {temFiltroAtivo && (
                      <button 
                        onClick={limparTodosFiltros}
                        className="px-3 py-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors border border-indigo-100 text-center"
                      >
                        Limpar
                      </button>
                    )}

                  </div>
                </div>

                {/* Listagem */}
                <div className="overflow-x-auto max-h-[500px]">
                  <table className="w-full text-left border-collapse">
                    <thead className="sticky top-0 bg-white z-10 shadow-sm border-b border-slate-100">
                      <tr className="text-slate-400 text-[10px] font-bold uppercase tracking-wider bg-slate-50/50">
                        <th className="p-4 w-[110px]">Pedido</th>
                        <th className="p-4">Cliente</th>
                        <th className="p-4">Segmento</th>
                        <th className="p-4 text-center w-[120px]">Qtd Amostras</th>
                        <th className="p-4 w-[120px]">Emissão</th>
                        <th className="p-4 w-[130px]">Status Lote</th>
                        <th className="p-4 w-[240px]">Observações Consolidadas</th>
                      </tr>
                    </thead>
                    <tbody>
                      {dadosFiltrados.length > 0 ? (
                        dadosFiltrados.map((pedido) => (
                          <tr 
                            key={pedido.id} 
                            onClick={() => setPedidoSelecionado(pedido)}
                            className="border-b border-slate-100 hover:bg-slate-50/60 transition-colors cursor-pointer group"
                          >
                            <td className="p-4 text-xs font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">#{pedido.id}</td>
                            <td className="p-4 text-xs font-bold text-slate-700">{pedido.cliente}</td>
                            <td className="p-4 text-xs">
                              <span className="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-lg text-[10px] font-semibold border border-slate-200">
                                {pedido.segmento}
                              </span>
                            </td>
                            <td className="p-4 text-xs text-center font-bold">
                              <span className="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full text-[10px] border border-indigo-100">
                                {pedido.itens.length} {pedido.itens.length === 1 ? 'item' : 'itens'}
                              </span>
                            </td>
                            <td className="p-4 text-xs text-slate-400 font-medium">{pedido.dataEntrada}</td>
                            <td className="p-4"><StatusBadge status={pedido.statusGeral} /></td>
                            <td className="p-4 text-xs text-slate-500 max-w-[240px] truncate" title={pedido.observacao}>
                              {pedido.observacao ? (
                                <span className="flex items-center gap-1.5">
                                  <IconMessageSquare className="w-3.5 h-3.5 text-slate-300 shrink-0" />
                                  <span className="truncate">{pedido.observacao}</span>
                                </span>
                              ) : (
                                <span className="text-slate-300 italic">-</span>
                              )}
                            </td>
                          </tr>
                        ))
                      ) : (
                        <tr>
                          <td colSpan="7" className="p-12 text-center text-xs text-slate-400 font-bold bg-white">
                            Nenhum lote corresponde aos termos de pesquisa selecionados.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {/* DETALHES DO PEDIDO SELECIONADO (SIDE DRAWER DE VIDRO) */}
          {pedidoSelecionado && (
            <div className="fixed inset-0 z-50 flex justify-end bg-slate-950/20 backdrop-blur-sm transition-all duration-300">
              <div className="flex-1" onClick={() => setPedidoSelecionado(null)}></div>
              
              <div className="w-full max-w-xl bg-white shadow-2xl h-screen flex flex-col border-l border-slate-100 animate-slide-in relative">
                
                {/* Header da Gaveta */}
                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] uppercase font-black tracking-widest text-indigo-400">Detalhamento Analítico</span>
                    <h3 className="text-lg font-black tracking-tight mt-0.5">Pedido {pedidoSelecionado.id}</h3>
                  </div>
                  <button 
                    onClick={() => setPedidoSelecionado(null)}
                    className="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-all"
                  >
                    <IconClose className="w-5 h-5" />
                  </button>
                </div>

                {/* Resumo Rápido */}
                <div className="bg-slate-50/50 p-5 border-b border-slate-100 grid grid-cols-2 gap-4 text-xs">
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Cliente do Pedido</p>
                    <p className="text-sm font-bold text-slate-800 mt-0.5">{pedidoSelecionado.cliente}</p>
                  </div>
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Segmento Unificado</p>
                    <p className="text-sm font-bold text-slate-800 mt-0.5">{pedidoSelecionado.segmento}</p>
                  </div>
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Data de Entrada</p>
                    <p className="text-sm font-semibold text-slate-500 mt-0.5">{pedidoSelecionado.dataEntrada}</p>
                  </div>
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[9px] tracking-wider">Status Sintético</p>
                    <div className="mt-1">
                      <StatusBadge status={pedidoSelecionado.statusGeral} />
                    </div>
                  </div>
                </div>

                {/* Listagem de Amostras/Itens */}
                <div className="flex-1 p-5 overflow-y-auto space-y-4">
                  <h4 className="text-xs font-black tracking-widest text-slate-400 uppercase flex items-center gap-2">
                    <IconPackage className="w-4 h-4 text-indigo-600" />
                    Itens neste Pedido ({pedidoSelecionado.itens.length})
                  </h4>
                  
                  {pedidoSelecionado.itens.map((item, idx) => {
                    let progresso = "w-1/5 bg-slate-400";
                    if (item.status === "OPs Abertas") progresso = "w-2/5 bg-indigo-500";
                    if (item.status === "Em Andamento") progresso = "w-3/5 bg-amber-500";
                    if (item.status === "Finalizando") progresso = "w-4/5 bg-emerald-500";
                    if (item.status === "Entregue") progresso = "w-full bg-slate-800";

                    return (
                      <div key={item.idLinha || idx} className="bg-white p-4 rounded-xl border border-slate-150 shadow-sm relative overflow-hidden transition-all hover:border-indigo-200">
                        <div className={`absolute top-0 left-0 right-0 h-1.5 ${
                          item.status === 'Em Fila' ? 'bg-slate-400' :
                          item.status === 'OPs Abertas' ? 'bg-indigo-500' :
                          item.status === 'Em Andamento' ? 'bg-amber-500' : 
                          item.status === 'Finalizando' ? 'bg-emerald-500' : 'bg-slate-800'
                        }`} />
                        
                        {/* CÓDIGO E DESCRIÇÃO DO PRODUTO (Export Colunas J e K) */}
                        <div className="pt-2 mb-3 space-y-1.5">
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-[10px] font-extrabold uppercase px-2.5 py-0.5 bg-slate-100 text-slate-700 rounded-lg border border-slate-200 tracking-wider">
                              Cód. Produto: {item.produto}
                            </span>
                            <StatusBadge status={item.status} />
                          </div>
                          
                          <div className="bg-slate-50/50 p-2.5 rounded-lg border border-slate-100 mt-2">
                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Descrição do Produto</p>
                            <h5 className="text-xs font-semibold text-slate-800 tracking-tight mt-1">
                              {item.descricao || "Descrição não cadastrada"}
                            </h5>
                          </div>
                        </div>

                        {/* Linha de Progresso do Fluxo */}
                        <div className="mt-4">
                          <div className="flex justify-between text-[9px] text-slate-400 font-extrabold uppercase tracking-wider">
                            <span>Workflow de Amostra</span>
                            <span>{item.status}</span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-1.5 mt-1">
                            <div className={`h-1.5 rounded-full transition-all duration-300 ${progresso}`} />
                          </div>
                        </div>

                        {/* Responsável, Quantidade e Observação do respectivo Item */}
                        <div className="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2.5 text-xs">
                          <div className="flex justify-between items-center text-[10px]">
                            <span className="text-slate-400 font-semibold">Vendedor(a):</span>
                            <span className="text-slate-700 font-bold bg-slate-100 px-2 py-0.5 rounded">{item.vendedor}</span>
                          </div>
                          <div className="flex justify-between items-center text-[10px]">
                            <span className="text-slate-400 font-semibold">Quantidade solicitada:</span>
                            <span className="text-slate-700 font-bold">{item.quantidade} kg</span>
                          </div>
                          {item.dataEntrega && item.dataEntrega !== "-" && (
                            <div className="flex justify-between items-center text-[10px]">
                              <span className="text-slate-400 font-semibold">Previsão de Entrega:</span>
                              <span className="text-slate-600 font-medium">{item.dataEntrega}</span>
                            </div>
                          )}
                          
                          {/* OBSERVAÇÃO DO RESPECTIVO ITEM DA PLANILHA */}
                          {item.observacao ? (
                            <div className="bg-indigo-50/40 p-3 rounded-xl border border-indigo-100/60 mt-1">
                              <p className="text-[9px] font-extrabold text-indigo-600 uppercase tracking-widest flex items-center gap-1.5 mb-1.5">
                                <IconMessageSquare className="w-3.5 h-3.5" />
                                Observações do Pedido / Item
                              </p>
                              <p className="text-xs text-slate-700 font-medium leading-relaxed bg-white p-2.5 rounded-lg border border-indigo-100/30 whitespace-pre-wrap">
                                {item.observacao}
                              </p>
                            </div>
                          ) : (
                            <div className="text-[10px] text-slate-350 italic mt-1 flex items-center gap-1">
                              <span>- Nenhuma anotação de observação cadastrada para este item.</span>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Rodapé do Drawer */}
                <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-end">
                  <button 
                    onClick={() => setPedidoSelecionado(null)}
                    className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-lg transition-all"
                  >
                    Fechar Detalhes
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // --- INICIALIZAÇÃO DO REACT ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <style>
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-slide-in {
      animation: slideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</body>
</html>
